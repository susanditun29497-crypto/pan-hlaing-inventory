<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purchase History</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="container">

<h1>
📦 Purchase History
</h1>

<div id="purchaseSummary" class="summaryRow">

<div class="summaryBox">
<h3>Purchase Value</h3>
<p id="purchaseValue">0 MMK</p>
</div>

<div class="summaryBox">
<h3>Total Units</h3>
<p id="purchaseUnits">0</p>
</div>

<select id="vendorFilter">
<option value="">All Vendors</option>
</select>



</div>

<div class="historyFilters">

<input
id="search"
placeholder="Search vendor, brand or variety..."
>

<input
type="date"
id="fromDate"
>

<input
type="date"
id="toDate"
>

<button
type="button"
id="resetFilters"
>
Reset
</button>

</div>

<div id="purchaseList">

Loading...

</div>


<br>


<button onclick="location.href='index.html'">
Back
</button>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/purchase-history.js"></script>


</body>

</html>
